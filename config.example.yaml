# ==============================================================================
# Llama Gateway & Idle Watcher Configuration
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8000

# Backend llama.cpp server (local GPU node reached via WireGuard VPN)
llamacpp:
  backend_url: "http://10.10.0.3:8080"
  health_path: "/health"

# MCP Servers hosted on the local node
mcp_servers:
  - name: "filesystem"
    backend_url: "http://10.10.0.2:8001"
    health_path: "/health"
    auto_discover: true         # When true: tool definitions are auto-discovered from the MCP server and saved directly here in config.yaml!
                                # When false: auto-discovery will never overwrite your manual edits in this file.
    
    # --------------------------------------------------------------------------
    # Auth Middleware Configuration (Upstream & Downstream Authentication)
    # The Gateway acts as an authentication adapter / bridge between client and MCP server:
    # --------------------------------------------------------------------------
    # 1. upstream_auth (or client_auth): required from the client (e.g. Open WebUI, agent)
    #    so the gateway endpoint is never unprotected.
    upstream_auth:
      type: "bearer"            # "bearer", "basic", "header" / "api_key", "none"
      token: "gateway-client-secret-token"

    # 2. downstream_auth (or backend_auth): credentials injected by the Gateway when
    #    forwarding requests, health checks, and discovery to the downstream MCP server.
    #    Allows using downstream MCP servers requiring Basic auth, custom headers, or Bearer tokens
    #    even if the client does not support them!
    downstream_auth:
      type: "basic"             # e.g. downstream MCP requires HTTP Basic auth
      username: "mcp_admin"
      password: "mcp_secret_password"
      # OR Bearer token:
      # type: "bearer"
      # token: "downstream-secret-token"
      # OR Custom Header / API Key:
      # type: "api_key"
      # header: "X-API-Key"
      # value: "my-mcp-api-key"

    # Legacy alias: bearer_token (still supported for backwards compatibility)
    # bearer_token: "secret-token"
    tools:
      - name: "read_file"
        description: "Read the contents of a file in the allowed workspace"
        inputSchema:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative file path"
            base_dir:
              type: "string"
              description: "Internal server directory"
            auth_token:
              type: "string"
              description: "Internal service authentication token"
          required: ["path", "base_dir", "auth_token"]
        # Hidden fields are stripped from the schema exposed to LLM/clients,
        # and their default values are automatically injected when the tool is proxied!
        hidden_parameters:
          base_dir: "/var/data/workspace"
          auth_token: "internal-secret-token"

      - name: "write_file"
        description: "Write content to a file"
        inputSchema:
          type: "object"
          properties:
            path:
              type: "string"
            content:
              type: "string"
          required: ["path", "content"]

  - name: "browser"
    backend_url: "http://10.10.0.2:8002"
    health_path: "/health"
    tools:
      - name: "browse_url"
        description: "Fetch and render a webpage"
        inputSchema:
          type: "object"
          properties:
            url:
              type: "string"
          required: ["url"]

# Web & API Services (Arbitrary Web Services, CI/CD, Dashboards with Wake-on-Request)
# When accessed via browser while the node is sleeping, the Gateway displays an Onrender-style
# animated waiting page with real-time SSE boot updates, automatically redirecting when ready.
# For API requests, transparent wake-and-wait and proxying are performed automatically.
services:
  - name: "jenkins"
    backend_url: "http://10.10.0.2:8080"
    path_prefix: "/services/jenkins"     # Route prefix (optional; defaults to /services/{name})
    health_path: "/login"                # Fast probe endpoint to check if service is up (default "/")
    mode: "proxy"                        # "proxy" (reverse proxy) or "redirect" (redirects browser directly once online)
    title: "Jenkins CI/CD"
    description: "Automated continuous integration and build server"
    icon: "🏗️"
    # Optional custom wake triggers (executed in addition to global MQTT wake):
    wake:
      mqtt_topic: null                   # Optional custom MQTT topic for this service
      mqtt_payload: null                 # Optional custom MQTT payload
      webhook_url: null                  # Optional webhook URL to trigger wake (e.g. "http://supervisor:5000/start")

  - name: "grafana"
    backend_url: "http://10.10.0.2:3000"
    health_path: "/api/health"
    mode: "redirect"                     # Directly redirects browser once server is awake
    redirect_url: "http://10.10.0.2:3000"
    title: "Grafana Dashboards"
    description: "System metrics and homelab monitoring"
    icon: "📊"

  # Esempio Servizio Locale / Container (Non richiede l'accensione del server fisico remoto):
  # Gli URL locali (localhost / 127.0.0.1) o la flag esplicita 'wake_node: false' (o 'skip_node_wake: true')
  # saltano l'accensione del nodo fisico remoto e attivano solo l'eventuale wake del servizio (es. webhook o MQTT)
  - name: "local-dashboard"
    backend_url: "http://127.0.0.1:8080"
    path_prefix: "/dashboard"
    health_path: "/healthz"
    mode: "proxy"
    wake_node: false                     # Salta il risveglio fisico del server remoto (auto-rilevato per 127.0.0.1/localhost)
    title: "Gateway Local Dashboard"
    description: "Dashboard locale in esecuzione direttamente sulla macchina gateway"
    icon: "⚡"
    wake:
      webhook_url: "http://127.0.0.1:5000/docker/start/dashboard" # Opzionale: avvia solo il container locale quando spento

# Static models list returned on GET /v1/models (always 200 OK for Open WebUI)
models:
  - id: "llama-3.3-70b-instruct"
    object: "model"
    created: 1700000000
    owned_by: "local-gpu"
  - id: "qwen-2.5-coder-32b"
    object: "model"
    created: 1700000000
    owned_by: "local-gpu"

# MQTT Wake-up configuration (used to trigger ESP32 relay to power on GPU node)
mqtt:
  host: "127.0.0.1"          # Mosquitto broker on cloud machine
  port: 1883                 # 1883 for plaintext, 8883 for TLS
  username: "gateway_user"    # Optional MQTT username
  password: "secretpassword"  # Optional MQTT password
  use_tls: false              # Set to true if broker uses TLS (e.g. port 8883)
  tls_ca_cert: null           # Optional: path to custom CA certificate file (e.g. "/etc/ssl/certs/ca.crt")
  tls_certfile: null          # Optional: client certificate for mTLS
  tls_keyfile: null           # Optional: client private key for mTLS
  tls_insecure: false         # Set to true to bypass cert/hostname verification (for self-signed certs)
  topic: "home/node/wake"     # Topic monitored by ESP32
  payload: "wake"             # Payload sent to trigger boot
  qos: 1                      # QoS level (0 or 1)
  timeout: 5.0                # Seconds to wait for publish confirmation

# Wake-on-request polling and timeout settings
wake:
  health_check_timeout: 1.5   # Seconds for fast health probe
  polling_interval: 2.0       # Seconds between reachability checks during wake-up
  max_timeout: 120.0          # Max seconds to wait for boot before returning HTTP 503
  keep_alive_interval: 5.0    # Seconds between SSE keep-alive comments (: keep-alive\n\n)
  estimated_boot_duration: 45.0 # Estimated seconds for server startup (progress tracking when return_progress: true)

# Auto-shutdown configuration (managed directly by the Gateway in cloud, zero-install on GPU node)
# Automatically publishes an MQTT message to shut down the node after inactivity.
auto_shutdown:
  enabled: true                          # Enable Gateway-managed automatic shutdown
  inactivity_threshold: 600.0            # Seconds of inactivity before shutdown (10 min)
  check_interval: 30.0                   # Seconds between inactivity checks
  grace_period: 120.0                    # Seconds post-boot/startup where shutdown is never triggered (2 min)
  topic: null                            # Optional: custom MQTT topic (defaults to mqtt.topic if null)
  payload: null                          # Optional: custom MQTT payload (defaults to mqtt.payload if null)

# Legacy Idle Watcher configuration (optional daemon that runs locally on GPU node)
# Not needed if using auto_shutdown via MQTT above.
watcher:
  gateway_url: "http://10.10.0.1:8000"   # Gateway IP/port accessible via WireGuard
  poll_interval: 60.0                    # Seconds between gateway status checks
  inactivity_threshold: 600.0            # Seconds of inactivity before shutdown (10 min)
  grace_period: 120.0                    # Seconds post-boot where poweroff is never executed (2 min)
  shutdown_command: "systemctl poweroff" # Command executed to power off local machine
  dry_run: true                         # Set true to simulate without powering off
