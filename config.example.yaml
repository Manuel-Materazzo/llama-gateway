# ==============================================================================
# Llama Gateway & Idle Watcher Configuration
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8000

# Backend llama.cpp server (local GPU node reached via WireGuard VPN)
llamacpp:
  backend_url: "http://10.10.0.3:8080"
  health_path: "/health"

# MCP Servers hosted on the local node
mcp_servers:
  - name: "filesystem"
    backend_url: "http://10.10.0.2:8001"
    health_path: "/health"
    auto_discover: true         # When true: tool definitions are auto-discovered from the MCP server and saved directly here in config.yaml!
                                # When false: auto-discovery will never overwrite your manual edits in this file.
    bearer_token: null          # Optional: static Bearer token forwarded to upstream server (e.g. "secret-token"). Client Authorization headers are also forwarded if provided.
    tools:
      - name: "read_file"
        description: "Read the contents of a file in the allowed workspace"
        inputSchema:
          type: "object"
          properties:
            path:
              type: "string"
              description: "Relative file path"
            base_dir:
              type: "string"
              description: "Internal server directory"
            auth_token:
              type: "string"
              description: "Internal service authentication token"
          required: ["path", "base_dir", "auth_token"]
        # Hidden fields are stripped from the schema exposed to LLM/clients,
        # and their default values are automatically injected when the tool is proxied!
        hidden_parameters:
          base_dir: "/var/data/workspace"
          auth_token: "internal-secret-token"

      - name: "write_file"
        description: "Write content to a file"
        inputSchema:
          type: "object"
          properties:
            path:
              type: "string"
            content:
              type: "string"
          required: ["path", "content"]

  - name: "browser"
    backend_url: "http://10.10.0.2:8002"
    health_path: "/health"
    tools:
      - name: "browse_url"
        description: "Fetch and render a webpage"
        inputSchema:
          type: "object"
          properties:
            url:
              type: "string"
          required: ["url"]

# Static models list returned on GET /v1/models (always 200 OK for Open WebUI)
models:
  - id: "llama-3.3-70b-instruct"
    object: "model"
    created: 1700000000
    owned_by: "local-gpu"
  - id: "qwen-2.5-coder-32b"
    object: "model"
    created: 1700000000
    owned_by: "local-gpu"

# MQTT Wake-up configuration (used to trigger ESP32 relay to power on GPU node)
mqtt:
  host: "127.0.0.1"          # Mosquitto broker on cloud machine
  port: 1883                 # 1883 for plaintext, 8883 for TLS
  username: "gateway_user"    # Optional MQTT username
  password: "secretpassword"  # Optional MQTT password
  use_tls: false              # Set to true if broker uses TLS (e.g. port 8883)
  tls_ca_cert: null           # Optional: path to custom CA certificate file (e.g. "/etc/ssl/certs/ca.crt")
  tls_certfile: null          # Optional: client certificate for mTLS
  tls_keyfile: null           # Optional: client private key for mTLS
  tls_insecure: false         # Set to true to bypass cert/hostname verification (for self-signed certs)
  topic: "home/node/wake"     # Topic monitored by ESP32
  payload: "wake"             # Payload sent to trigger boot
  qos: 1                      # QoS level (0 or 1)
  timeout: 5.0                # Seconds to wait for publish confirmation

# Wake-on-request polling and timeout settings
wake:
  health_check_timeout: 1.5   # Seconds for fast health probe
  polling_interval: 2.0       # Seconds between reachability checks during wake-up
  max_timeout: 120.0          # Max seconds to wait for boot before returning HTTP 503
  keep_alive_interval: 5.0    # Seconds between SSE keep-alive comments (: keep-alive\n\n)

# Auto-shutdown configuration (managed directly by the Gateway in cloud, zero-install on GPU node)
# Automatically publishes an MQTT message to shut down the node after inactivity.
auto_shutdown:
  enabled: true                          # Enable Gateway-managed automatic shutdown
  inactivity_threshold: 600.0            # Seconds of inactivity before shutdown (10 min)
  check_interval: 30.0                   # Seconds between inactivity checks
  grace_period: 120.0                    # Seconds post-boot/startup where shutdown is never triggered (2 min)
  topic: null                            # Optional: custom MQTT topic (defaults to mqtt.topic if null)
  payload: null                          # Optional: custom MQTT payload (defaults to mqtt.payload if null)

# Legacy Idle Watcher configuration (optional daemon that runs locally on GPU node)
# Not needed if using auto_shutdown via MQTT above.
watcher:
  gateway_url: "http://10.10.0.1:8000"   # Gateway IP/port accessible via WireGuard
  poll_interval: 60.0                    # Seconds between gateway status checks
  inactivity_threshold: 600.0            # Seconds of inactivity before shutdown (10 min)
  grace_period: 120.0                    # Seconds post-boot where poweroff is never executed (2 min)
  shutdown_command: "systemctl poweroff" # Command executed to power off local machine
  dry_run: true                         # Set true to simulate without powering off
